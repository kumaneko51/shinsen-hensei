<!doctype html>
<!--
  アプリの概要: 信長の野望・真戦の部隊を武将・戦法マスターから組み立てる公開用編成作業台。
  主な機能: 最大10部隊、主将・副将、突破、武将／戦法ライブラリ、所持管理、共有URL。
  関連ファイル／構成: index.html（GitHub Pages公開画面）、master.json（武将・戦法マスター）。
  更新日: 2026-08-30
  更新履歴:
    - 2026-08-24: 参照アプリの作業台構成に合わせた日本語版レイアウトを作成。
    - 2026-08-30: プロフィール、部隊グループ、共有一覧、提案、抽選記録、設定の端末内管理画面を追加。
    - 2026-08-30: 自由編成／所持品編成の切替と、武将・戦法のドラッグ配置を追加。
    - 2026-08-30: 編成枠の入替、共有URLの手動読み込み、部隊名入力の安定化を追加。
    - 2026-08-30: モバイル画面でも各機能ページを切り替えられるメニューを追加。
  メンテナンスメモ: 画像・説明文は権利確認済みのものだけを追加する。公開マスターを常に優先する。
-->
<html lang="ja">

round:#eff6ff; }

    .backdrop { position:fixed; inset:0; z-index:10; display:grid; place-items:center; padding:16px; background:rgba(15,23,42,.38); }.modal { width:min(600px,100%); max-height:88vh; overflow:auto; padding:20px; border-radius:12px; background:#fff; box-shadow:0 24px 70px rgba(15,23,42,.28); }.modal h2 { margin:0 0 5px; font-size:18px; }.modal p { color:var(--muted); font-size:12px; }.inventory { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:7px; margin:14px 0; }.inventory label { display:flex; gap:6px; align-items:center; padding:8px; border:1px solid var(--line); border-radius:6px; font-size:12px; }.modal-actions { display:flex; justify-content:flex-end; gap:8px; }.toast { position:fixed; right:18px; bottom:18px; z-index:20; max-width:330px; padding:11px 14px; border-radius:8px; color:#fff; background:#0f172a; box-shadow:0 8px 24px rgba(15,23,42,.26); font-size:12px; }
    @media(max-width:1000px) { .slots { grid-template-columns:1fr; }.main { grid-template-columns:185px minmax(400px,1fr); }.cards { max-height:none; } } @media(max-width:720px) { .app { display:block; }.side { display:none; }.top { position:static; flex-wrap:wrap; padding:10px 12px; }.summary { order:3; width:100%; }.main { display:block; }.teams { border-right:0; border-bottom:1px solid var(--line); }.teams .team,.teams .actions { display:none; }.team-name { min-width:0; flex:1; }.slots,.library { padding:12px; } }
  .portrait { overflow:hidden; }.portrait img { width:100%; height:100%; object-fit:cover; }.card-photo { display:block; width:calc(100% + 20px); height:188px; margin:-10px -10px 8px; border-radius:7px 7px 0 0; object-fit:cover; background:#e2e8f0; }.card.unique { cursor:not-allowed; }.tip { position:absolute; right:7px; bottom:7px; display:grid; place-items:center; width:18px; height:18px; border-radius:50%; color:#2563eb; background:#eff6ff; font-size:12px; font-weight:800; }.tipbox { position:absolute; right:0; bottom:24px; z-index:4; display:none; width:280px; padding:10px; border:1px solid #bfdbfe; border-radius:7px; color:#334155; background:#fff; box-shadow:0 8px 20px rgba(15,23,42,.18); font-size:11px; font-weight:400; line-height:1.6; white-space:normal; }.tip:hover .tipbox,.tip:focus .tipbox { display:block; }.tipbox strong { display:block; margin:6px 0 2px; color:#1d4ed8; }.work { display:grid; grid-template-columns:minmax(720px,1.15fr) minmax(390px,.85fr); min-height:calc(100vh - 69px); }.slots { grid-template-columns:repeat(3,minmax(220px,1fr)); align-content:start; overflow:auto; padding:12px; border-right:1px solid var(--line); border-bottom:0; background:#f8fafc; }.slot { padding:10px; }.hero { flex-direction:column; align-items:stretch; gap:5px; margin:5px 0; }.hero > span:nth-child(2) { order:1; }.hero .portrait { order:2; width:100%; height:300px; flex:0 0 auto; border-radius:6px; }.hero .portrait img { width:100%; height:100%; object-fit:cover; }.library { min-width:0; max-height:calc(100vh - 69px); overflow:hidden; padding:12px 16px; background:#fff; }.library .cards { grid-template-columns:repeat(3,minmax(110px,1fr)); max-height:calc(100vh - 190px); padding:3px; }.library .card-photo { height:145px; }.library.tactics-pane .cards { grid-template-columns:1fr; }.library.tactics-pane .card { min-height:92px; padding-right:34px; }.library.tactics-pane .card h3 { margin-top:2px; font-size:14px; }.library.tactics-pane .tipbox { right:2px; bottom:28px; }.tactic-card:hover .tipbox,.tactic-card:focus-within .tipbox { display:block; }
    .page { width:min(1080px,100%); margin:0 auto; padding:30px; }.page-head { display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; margin-bottom:20px; }.page-head h1 { margin:0; font-size:23px; }.page-head p { width:100%; margin:0; color:var(--muted); font-size:13px; }.page-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(255px,1fr)); gap:12px; }.panel { padding:16px; border:1px solid var(--line); border-radius:10px; background:#fff; box-shadow:0 2px 8px rgba(15,23,42,.035); }.panel h2 { margin:0 0 7px; font-size:16px; }.panel p { margin:0 0 12px; color:var(--muted); font-size:12px; line-height:1.65; }.panel .actions { display:flex; flex-direction:row; flex-wrap:wrap; margin-top:12px; }.empty-panel { grid-column:1 / -1; padding:34px; border:1px dashed #b9c7d9; border-radius:10px; color:var(--muted); background:#fff; text-align:center; }.record-list { display:grid; gap:8px; }.record { display:flex; gap:10px; align-items:center; justify-content:space-between; padding:11px; border:1px solid var(--line); border-radius:8px; background:#fff; }.record strong,.record small { display:block; }.record small { margin-top:3px; color:var(--muted); font-size:11px; }.statline { display:flex; gap:20px; margin:10px 0; }.statline b { display:block; color:#1d4ed8; font-size:21px; }.notice { padding:10px 12px; border:1px solid #bfdbfe; border-radius:8px; color:#1e40af; background:#eff6ff; font-size:12px; line-height:1.6; }.route-select { display:none; }
    @media(max-width:1300px) { .work { grid-template-columns:minmax(610px,1fr) minmax(330px,.8fr); }.hero .portrait { height:240px; }.library .cards { grid-template-columns:repeat(2,minmax(120px,1fr)); } } @media(max-width:1050px) { .work { display:block; }.slots { border-right:0; border-bottom:1px solid var(--line); }.library { max-height:none; }.library .cards { max-height:none; }.hero .portrait { height:290px; } } @media(max-width:720px) { .page { padding:18px 12px; }.route-select { display:inline-block; } }</style>

<body>
  <div id="app"></div>
  <script>
    'use strict';

    /**
     * アプリ全体で使用する設定値。
     * @type {Object}
     */
    const CONFIG = {
      MASTER_URL: 'master.json',
      STORAGE_KEY: 'shinsen-hensei-workbench-v2',
      MAX_TEAMS: 10,
      MAX_MEMBERS: 3,
      MAX_BREAKTHROUGH: 5,
      TEAM_COST_LIMIT: 20,
      STORAGE_VERSION: 2
    };

    const ROLES = ['主将', '副将', '副将'];
    const STAT_LABELS = { leadership: '統', valor: '武', intelligence: '智', politics: '政', charisma: '魅', speed: '速' };
    let master = { heroes: [], tactics: [] };
    let state = makeState_();

    /**
     * 初期状態を作成する。
     * @returns {Object} アプリ状態。
     */
    function makeState_() {
      return { teams: [], activeTeam: 0, selected: { role: 0, kind: 'hero', slot: 0 }, inventory: { heroIds: [], tacticIds: [] }, profiles: [], groups: [], savedShares: [], proposals: [], gachaLogs: [], route: 'lineups', mode: 'free', tab: 'heroes', query: '', cost: '', faction: '', rarity: '', ownedOnly: false, modal: '', toast: '' };
    }

    /**
     * 空の武将枠を作成する。
     * @returns {Object} 武将枠。
     */
    function makeMember_() {
      return { heroId: '', breakthrough: 0, tacticIds: ['', ''], bonuses: { leadership: 0, valor: 0, intelligence: 0, politics: 0, charisma: 0, speed: 0 } };
    }

    /**
     * 新しい部隊を作成する。
     * @param {number} number 表示番号。
     * @returns {Object} 部隊。
     */
    function makeTeam_(number) {
      return { id: Date.now() + '-' + number, name: '部隊 ' + number, members: Array.from({ length: CONFIG.MAX_MEMBERS }, makeMember_) };
    }

    /**
     * マスターと端末保存データを読み込み、画面を開始する。
     * @returns {Promise<void>} 完了時に解決するPromise。
     */
    async function init() {
      try {
        const response = await fetch(CONFIG.MASTER_URL, { cache: 'no-cache' });
        if (response.ok) master = await response.json();
      } catch (error) {
        showToast_('公開マスターを読み込めませんでした。');
      }
      const saved = loadState_();
      state.teams = Array.isArray(saved.teams) ? saved.teams.map(normalizeTeam_) : [makeTeam_(1)];
      state.inventory = normalizeInventory_(saved.inventory);
      state.profiles = Array.isArray(saved.profiles) ? saved.profiles : [];
      state.groups = Array.isArray(saved.groups) ? saved.groups : [];
      state.savedShares = Array.isArray(saved.savedShares) ? saved.savedShares : [];
      state.proposals = Array.isArray(saved.proposals) ? saved.proposals : [];
      state.gachaLogs = Array.isArray(saved.gachaLogs) ? saved.gachaLogs : [];
      state.mode = saved.mode === 'inventory' ? 'inventory' : 'free';
      state.activeTeam = Math.min(Number(saved.activeTeam) || 0, Math.max(0, state.teams.length - 1));
      if (!state.teams.length) state.teams.push(makeTeam_(1));
      restoreRoute_();
      render();
    }

    /**
     * 端末内の保存データを読み込む。
     * @returns {Object} 保存データ。
     */
    function loadState_() {
      try { return JSON.parse(localStorage.getItem(CONFIG.STORAGE_KEY) || '{}'); } catch (error) { return {}; }
    }

    /**
     * 古い部隊データも含めて現行形式に補正する。
     * @param {Object} team 部隊データ。
     * @returns {Object} 補正済み部隊。
     */
    function normalizeTeam_(team) {
      const members = Array.isArray(team.members) ? team.members.slice(0, 3).map(function(member) {
        const base = makeMember_();
        return { ...base, ...member, tacticIds: [((member.tacticIds || [])[0] || ''), ((member.tacticIds || [])[1] || '')], bonuses: { ...base.bonuses, ...(member.bonuses || member.stats || {}) } };
      }) : [];
      while (members.length < 3) members.push(makeMember_());
      return { id: team.id || String(Date.now()), name: String(team.name || '部隊'), members: members };
    }

    /**
     * 所持データを補正する。
     * @param {Object} inventory 所持データ。
     * @returns {Object} 補正済み所持データ。
     */
    function normalizeInventory_(inventory) {
      return { heroIds: Array.isArray((inventory || {}).heroIds) ? inventory.heroIds : [], tacticIds: Array.isArray((inventory || {}).tacticIds) ? inventory.tacticIds : [] };
    }

    /**
     * アプリ全体を描画する。
     * @returns {void}
     */
    function render() {
      const team = activeTeam_();
      const content = state.route === 'lineups' ? '<main class="main">' + teamList_() + '<section class="work">' + slots_(team) + library_() + '</section></main>' : page_();
      document.getElementById('app').innerHTML = '<div class="app">' + sidebar_() + '<div class="shell">' + (state.route === 'lineups' ? topbar_(team) : pageTopbar_()) + content + '</div></div>' + modal_() + (state.toast ? '<div class="toast">' + escape_(state.toast) + '</div>' : '');
      bind_();
    }

    /**
     * 左サイドバーを描画する。
     * @returns {string} HTML。
     */
    function sidebar_() {
      const item = function(route, icon, label) { return '<button class="nav ' + (state.route === route ? 'active' : '') + '" data-route="' + route + '">' + icon + '　' + label + '</button>'; };
      return '<aside class="side"><a class="brand" href="#/lineups"><span class="mark">戦</span><span>真戦編成<small>SHINSEI · JP</small></span></a><p class="label">主要機能</p>' + item('lineups', '♜', '編成作業台') + item('profiles', '♙', 'プロフィール') + item('groups', '▦', '部隊グループ') + item('shares', '↗', '共有一覧') + item('proposals', '◇', '編成提案') + item('gacha', '✦', '抽選記録') + '<p class="label">その他</p>' + item('settings', '⚙', '設定') + '<div class="side-foot">非公式ファンツール<br>データ・商標の権利は各権利者に帰属します。</div></aside>';
    }

    /**
     * 編成作業台以外の上部バーを描画する。
     * @returns {string} HTML。
     */
    function pageTopbar_() {
      return '<header class="top">' + routeSelect_() + '<strong>真戦編成 日本語版</strong><span class="summary">端末内保存モード</span><button class="btn" data-route="lineups">編成作業台へ</button></header>';
    }

    /**
     * モバイル用のページ選択メニューを描画する。
     * @returns {string} HTML。
     */
    function routeSelect_() {
      const routes = { lineups: '編成', profiles: 'プロフィール', groups: 'グループ', shares: '共有', proposals: '提案', gacha: '抽選記録', settings: '設定' };
      return '<select class="select route-select" data-route-select aria-label="ページ選択">' + Object.keys(routes).map(function(key) { return '<option value="' + key + '"' + (state.route === key ? ' selected' : '') + '>' + routes[key] + '</option>'; }).join('') + '</select>';
    }

    /**
     * 上部の編成情報を描画する。
     * @param {Object} team 表示中の部隊。
     * @returns {string} HTML。
     */
    function topbar_(team) {
      const cost = teamCost_(team);
      const troops = troopSummary_(team);
      return '<header class="top">' + routeSelect_() + '<select class="select" data-mode aria-label="編成モード"><option value="free"' + (state.mode === 'free' ? ' selected' : '') + '>自由編成</option><option value="inventory"' + (state.mode === 'inventory' ? ' selected' : '') + '>所持品編成</option></select><select class="select" data-team-select>' + state.teams.map(function(item, index) { return '<option value="' + index + '"' + (index === state.activeTeam ? ' selected' : '') + '>編成 ' + (index + 1) + '</option>'; }).join('') + '</select><input class="team-name" data-team-name aria-label="部隊名" value="' + escape_(team.name) + '"><div class="summary"><span>コスト<b class="' + (cost > 20 ? 'warn' : '') + '">' + cost + ' / 20</b></span><span>兵種<b>歩 ' + troops.foot + '　弓 ' + troops.bow + '　騎 ' + troops.cavalry + '　砲 ' + troops.gun + '</b></span></div><button class="btn" data-modal="inventory">所持管理</button><button class="btn" data-action="import-link">URLを読み込む</button><button class="btn" data-action="share">共有</button><button class="btn danger" data-action="reset">リセット</button></header>';
    }

    /**
     * 部隊一覧を描画する。
     * @returns {string} HTML。
     */
    function teamList_() {
      return '<aside class="teams"><div class="teams-head"><span>部隊一覧</span><span>' + state.teams.length + ' / 10</span></div>' + state.teams.map(function(team, index) { return '<button class="team ' + (index === state.activeTeam ? 'active' : '') + '" data-select-team="' + index + '"><span class="num">' + (index + 1) + '</span><span><strong>' + escape_(team.name) + '</strong><small>' + teamCost_(team) + ' / 20 コスト</small></span></button>'; }).join('') + '<button class="add" data-action="add">＋ 部隊を追加</button><div class="actions"><button class="btn" data-action="share">この部隊を共有</button><button class="btn danger" data-action="delete">この部隊を削除</button></div></aside>';
    }

    /**
     * 主将・副将3枠を描画する。
     * @param {Object} team 表示中の部隊。
     * @returns {string} HTML。
     */
    function slots_(team) {
      return '<section class="slots">' + team.members.map(function(member, role) { return slot_(member, role); }).join('') + '</section>';
    }

    /**
     * 部隊内の一枠を描画する。
     * @param {Object} member 枠データ。
     * @param {number} role 役割番号。
     * @returns {string} HTML。
     */
    function slot_(member, role) {
      const hero = hero_(member.heroId);
      const selected = state.selected.role === role;
      if (!hero) return '<article class="slot ' + (selected ? 'selected' : '') + '" data-drop-role="' + role + '"><div class="role">' + ROLES[role] + '</div><button class="btn" data-focus-hero="' + role + '">＋ 武将を選択</button><div class="skill">武将を選択すると戦法を設定できます</div></article>';
      const visual = hero.portrait ? '<img src="' + escape_(hero.portrait) + '" alt="" loading="lazy" referrerpolicy="no-referrer">' : escape_(hero.name.slice(0, 1));
      const stats = Object.keys(STAT_LABELS).map(function(key) { return '<div class="stat"><span>' + STAT_LABELS[key] + '</span><b>' + (Number((hero.stats || {})[key] || 0) + Number((member.bonuses || {})[key] || 0)) + '</b></div>'; }).join('');
      const traits = (hero.traits || []).slice(0, 4).map(function(trait) { return '<span class="tag ' + (trait.rank === 'S' ? 's' : '') + '">' + escape_(trait.name) + '</span>'; }).join('');
      const skills = member.tacticIds.map(function(id, index) { const tactic = tactic_(id); const active = selected && state.selected.kind === 'tactic' && state.selected.slot === index; return '<button class="skill ' + (active ? 'active' : '') + '" data-focus-tactic="' + role + ':' + index + '" data-drop-tactic="' + role + ':' + index + '">' + (tactic ? escape_(tactic.name) + '　<small>' + escape_(tactic.type || '') + '</small>' : '＋ 戦法を習得') + '</button>'; }).join('');
      return '<article class="slot ' + (selected ? 'selected' : '') + '" data-drop-role="' + role + '"><div class="role">' + ROLES[role] + (role === 0 ? '　大将技' : '') + '</div><button class="hero" data-focus-hero="' + role + '" data-drag-member="' + role + '" draggable="true"><span class="portrait">' + visual + '</span><span><span class="hero-name">' + escape_(hero.name) + '</span><span class="meta">' + escape_(hero.faction) + ' · ' + escape_(hero.clan || '') + '　' + hero.cost + 'C</span></span></button><div class="stars">' + stars_(role, member.breakthrough) + '</div><span class="tag s">' + escape_(hero.rarity || '') + '</span><span class="tag">' + hero.cost + 'C</span><span class="tag">' + escape_(hero.uniqueSkill || '固有戦法未設定') + '</span><div class="stats">' + stats + '</div><div class="traits">' + traits + '</div>' + skills + '</article>';
    }

    /**
     * 突破ボタンを描画する。
     * @param {number} role 役割番号。
     * @param {number} value 現在の突破数。
     * @returns {string} HTML。
     */
    function stars_(role, value) {
      return Array.from({ length: 5 }, function(_, index) { return '<button class="star ' + (index < value ? 'on' : '') + '" data-star="' + role + ':' + (index + 1) + '" aria-label="' + (index + 1) + '星突破">★</button>'; }).join('');
    }

    /**
     * 武将・戦法ライブラリを描画する。
     * @returns {string} HTML。
     */
    function library_() {
      const isHero = state.tab === 'heroes';
      const items = isHero ? filteredHeroes_() : filteredTactics_();
      const factionOptions = unique_(master.heroes || [], 'faction').map(function(value) { return '<option value="' + escape_(value) + '"' + (state.faction === value ? ' selected' : '') + '>' + escape_(value) + '</option>'; }).join('');
      const rarityOptions = unique_(isHero ? master.heroes || [] : master.tactics || [], 'rarity').map(function(value) { return '<option value="' + escape_(value) + '"' + (state.rarity === value ? ' selected' : '') + '>' + escape_(value) + '</option>'; }).join('');
      return '<section class="library ' + (isHero ? '' : 'tactics-pane') + '"><div class="tabs"><button class="tab ' + (isHero ? 'active' : '') + '" data-tab="heroes">武将庫 <small>' + (master.heroes || []).length + '</small></button><button class="tab ' + (!isHero ? 'active' : '') + '" data-tab="tactics">戦法庫 <small>' + (master.tactics || []).length + '</small></button></div><div class="tools"><input class="search" type="search" data-query value="' + escape_(state.query) + '" placeholder="' + (isHero ? '武将名・固有戦法を検索…' : '戦法名を検索…') + '"><select class="filter" data-cost><option value="">コスト：すべて</option><option value="7"' + (state.cost === '7' ? ' selected' : '') + '>7C</option><option value="6"' + (state.cost === '6' ? ' selected' : '') + '>6C</option><option value="5"' + (state.cost === '5' ? ' selected' : '') + '>5C</option><option value="4"' + (state.cost === '4' ? ' selected' : '') + '>4C以下</option></select>' + (isHero ? '<select class="filter" data-faction><option value="">勢力：すべて</option>' + factionOptions + '</select>' : '<select class="filter" data-type><option value="">種別：すべて</option><option value="指揮">指揮</option><option value="能動">能動</option><option value="受動">受動</option><option value="追撃">追撃</option></select>') + '<select class="filter" data-rarity><option value="">レア度：すべて</option>' + rarityOptions + '</select><label class="switch"><input type="checkbox" data-owned-filter' + (state.ownedOnly ? ' checked' : '') + '> 所持のみ</label></div><div class="cards ' + (isHero ? '' : 'tactic-list') + '">' + (items.map(isHero ? heroCard_ : tacticCard_).join('') || '<div class="empty">条件に一致するデータがありません。</div>') + '</div></section>';
    }

    /**
     * 武将カードを描画する。
     * @param {Object} hero 武将データ。
     * @returns {string} HTML。
     */
    function heroCard_(hero) {
      const used = activeTeam_().members.some(function(member) { return member.heroId === hero.id; });
      const owned = state.inventory.heroIds.includes(hero.id);
      const image = hero.portrait ? '<img class="card-photo" src="' + escape_(hero.portrait) + '" alt="' + escape_(hero.name) + 'の肖像" loading="lazy" referrerpolicy="no-referrer">' : '';
      return '<button class="card ' + (used ? 'disabled' : '') + '" data-hero="' + escape_(hero.id) + '" data-drag-hero="' + escape_(hero.id) + '" draggable="' + (!used) + '">' + image + (owned ? '<span class="owned"></span>' : '') + '<span class="tag s">' + escape_(hero.rarity || '') + '</span><span class="tag">' + hero.cost + 'C</span><h3>' + escape_(hero.name) + '</h3><p>' + escape_(hero.faction) + ' · ' + escape_(hero.clan || '') + '</p><p>' + (used ? '編成済み' : escape_(hero.uniqueSkill || '')) + '</p></button>';
    }

    /**
     * 戦法カードを描画する。
     * @param {Object} tactic 戦法データ。
     * @returns {string} HTML。
     */
    function tacticCard_(tactic) {
      const owned = state.inventory.tacticIds.includes(tactic.id);
      const unique = !tactic.learnable;
      const summary = tactic.summary || ((tactic.type || '戦法') + '戦法。対象：' + (tactic.target || '未設定') + '。発動率：' + (tactic.activationRate || '未設定') + '。');
      const effect = tactic.effect || '効果本文は準備中です。';
      return '<button class="card tactic-card ' + (unique ? 'disabled unique' : '') + '"' + (unique ? ' aria-disabled="true"' : ' data-tactic="' + escape_(tactic.id) + '" data-drag-tactic="' + escape_(tactic.id) + '" draggable="true"') + '>' + (owned ? '<span class="owned"></span>' : '') + '<span class="tag s">' + escape_(tactic.rarity || '') + '</span><span class="tag">' + escape_(tactic.type || '') + '</span><h3>' + escape_(tactic.name) + '</h3><p>' + escape_(tactic.target || '') + '　発動 ' + escape_(tactic.activationRate || '') + '</p><p>' + (unique ? '固有戦法（選択不可）' : '習得可能') + '</p><span class="tip" tabindex="0" aria-label="戦法効果">ⓘ<span class="tipbox">' + escape_(summary) + '<strong>戦法効果（機械翻訳）</strong>' + escape_(effect) + '</span></span></button>';
    }

    /**
     * 現在の機能ページを描画する。
     * @returns {string} HTML。
     */
    function page_() {
      const pages = { profiles: profilesPage_, groups: groupsPage_, shares: sharesPage_, proposals: proposalsPage_, gacha: gachaPage_, settings: settingsPage_ };
      return '<main class="page">' + (pages[state.route] ? pages[state.route]() : lineupsPage_()) + '</main>';
    }

    /**
     * 編成画面へ戻る案内を描画する。
     * @returns {string} HTML。
     */
    function lineupsPage_() {
      return '<section class="empty-panel">編成作業台を選択してください。</section>';
    }

    /**
     * 所持品プロフィールのページを描画する。
     * @returns {string} HTML。
     */
    function profilesPage_() {
      const records = state.profiles.map(function(profile) {
        return '<article class="record"><span><strong>' + escape_(profile.name) + '</strong><small>武将 ' + (profile.inventory.heroIds || []).length + ' ・ 戦法 ' + (profile.inventory.tacticIds || []).length + '</small></span><span><button class="btn" data-profile-apply="' + escape_(profile.id) + '">適用</button> <button class="btn danger" data-profile-delete="' + escape_(profile.id) + '">削除</button></span></article>';
      }).join('');
      return pageHead_('プロフィール', '所持武将・所持戦法の状態を名前を付けて端末内に保存します。', '<button class="btn primary" data-action="profile-create">＋ 現在の所持品を保存</button>') + '<div class="notice">ログイン・クラウド同期は未接続です。この端末のブラウザ内だけに保存されます。</div><div class="record-list" style="margin-top:14px">' + (records || '<div class="empty-panel">保存済みプロフィールはありません。</div>') + '</div>';
    }

    /**
     * 部隊グループのページを描画する。
     * @returns {string} HTML。
     */
    function groupsPage_() {
      const records = state.groups.map(function(group) {
        return '<article class="panel"><h2>' + escape_(group.name) + '</h2><p>' + (group.teams || []).length + ' / ' + CONFIG.MAX_TEAMS + ' 部隊を保存</p><div class="actions"><button class="btn" data-group-load="' + escape_(group.id) + '">読み込む</button><button class="btn" data-group-overwrite="' + escape_(group.id) + '">現在の10部隊で更新</button><button class="btn danger" data-group-delete="' + escape_(group.id) + '">削除</button></div></article>';
      }).join('');
      return pageHead_('部隊グループ', '最大10部隊の編成をひとまとまりとして保存・切り替えできます。', '<button class="btn primary" data-action="group-create">＋ 現在の部隊をグループ保存</button>') + '<section class="page-grid">' + (records || '<div class="empty-panel">保存済みグループはありません。</div>') + '</section>';
    }

    /**
     * 共有一覧のページを描画する。
     * @returns {string} HTML。
     */
    function sharesPage_() {
      const records = state.savedShares.map(function(item) {
        return '<article class="record"><span><strong>' + escape_(item.name) + '</strong><small>' + escape_(item.team && item.team.name) + ' ・ ' + escape_(item.createdAt) + '</small></span><span><button class="btn" data-share-copy="' + escape_(item.id) + '">URLをコピー</button> <button class="btn" data-share-load="' + escape_(item.id) + '">開く</button> <button class="btn danger" data-share-delete="' + escape_(item.id) + '">削除</button></span></article>';
      }).join('');
      return pageHead_('共有一覧', '現在の編成を記録し、URLとして他の人に渡せます。', '<button class="btn primary" data-action="share-save">＋ 現在の部隊を保存</button>') + '<div class="record-list">' + (records || '<div class="empty-panel">保存済みの共有編成はありません。</div>') + '</div>';
    }

    /**
     * 編成提案のページを描画する。
     * @returns {string} HTML。
     */
    function proposalsPage_() {
      const records = state.proposals.map(function(item) {
        return '<article class="panel"><h2>' + escape_(item.title) + '</h2><p>' + escape_(item.description || '説明なし') + '</p><small>編成: ' + escape_(item.team.name) + '　評価: ' + Number(item.votes || 0) + '</small><div class="actions"><button class="btn" data-proposal-load="' + escape_(item.id) + '">編成を開く</button><button class="btn" data-proposal-vote="' + escape_(item.id) + '">参考になった</button><button class="btn danger" data-proposal-delete="' + escape_(item.id) + '">削除</button></div></article>';
      }).join('');
      return pageHead_('編成提案', '端末内で編成メモを提案として保存・評価できます。公開提案機能はクラウド接続後に利用できます。', '<button class="btn primary" data-action="proposal-create">＋ 現在の部隊を提案にする</button>') + '<section class="page-grid">' + (records || '<div class="empty-panel">保存済みの編成提案はありません。</div>') + '</section>';
    }

    /**
     * 抽選記録のページを描画する。
     * @returns {string} HTML。
     */
    function gachaPage_() {
      const totals = state.gachaLogs.reduce(function(result, item) { result.count += Number(item.count || 0); result.rare += Number(item.rare || 0); return result; }, { count: 0, rare: 0 });
      const records = state.gachaLogs.map(function(item) { return '<article class="record"><span><strong>' + escape_(item.pool) + '</strong><small>' + escape_(item.createdAt) + '　' + item.count + '回 ・ 高レア ' + item.rare + '件</small></span><button class="btn danger" data-gacha-delete="' + escape_(item.id) + '">削除</button></article>'; }).join('');
      return pageHead_('抽選記録', '抽選回数と高レア獲得数を端末内に記録します。', '<button class="btn primary" data-action="gacha-add">＋ 抽選を記録</button>') + '<div class="panel"><div class="statline"><span>総抽選数<b>' + totals.count + '</b></span><span>高レア獲得<b>' + totals.rare + '</b></span><span>高レア率<b>' + (totals.count ? Math.round(totals.rare / totals.count * 1000) / 10 : 0) + '%</b></span></div></div><div class="record-list" style="margin-top:14px">' + (records || '<div class="empty-panel">抽選記録はありません。</div>') + '</div>';
    }

    /**
     * 設定ページを描画する。
     * @returns {string} HTML。
     */
    function settingsPage_() {
      return pageHead_('設定', 'この端末に保存している情報を確認・削除します。') + '<section class="page-grid"><article class="panel"><h2>保存方式</h2><p>現在はブラウザの localStorage を使用しています。別の端末・別ブラウザには同期されません。</p></article><article class="panel"><h2>端末データ</h2><p>部隊、所持品、プロフィール、グループ、共有一覧、提案、抽選記録を削除できます。</p><button class="btn danger" data-action="clear-data">端末データをすべて削除</button></article></section>';
    }

    /**
     * 機能ページの見出しを描画する。
     * @param {string} title ページ名。
     * @param {string} description 説明。
     * @param {string} action 操作ボタンHTML。
     * @returns {string} HTML。
     */
    function pageHead_(title, description, action) {
      return '<section class="page-head"><h1>' + escape_(title) + '</h1>' + (action || '') + '<p>' + escape_(description) + '</p></section>';
    }

    /**
     * 所持管理モーダルを描画する。
     * @returns {string} HTML。
     */
    function modal_() {
      if (state.modal !== 'inventory') return '';
      const isHero = state.tab === 'heroes';
      const key = isHero ? 'heroIds' : 'tacticIds';
      const items = isHero ? master.heroes || [] : master.tactics || [];
      return '<div class="backdrop"><section class="modal" role="dialog" aria-modal="true"><h2>所持管理</h2><p>' + (isHero ? '所持している武将を選択してください。' : '所持している戦法を選択してください。') + '</p><div class="inventory">' + items.map(function(item) { return '<label><input type="checkbox" data-inventory="' + key + ':' + escape_(item.id) + '"' + (state.inventory[key].includes(item.id) ? ' checked' : '') + '><span>' + escape_(item.name) + '</span></label>'; }).join('') + '</div><div class="modal-actions"><button class="btn" data-close-modal>閉じる</button><button class="btn primary" data-action="save">保存</button></div></section></div>';
    }

    /**
     * DOMイベントを登録する。
     * @returns {void}
     */
    function bind_() {
      all_('[data-route]', function(element) { element.onclick = function() { changeRoute_(element.dataset.route); }; });
      all_('[data-route-select]', function(element) { element.onchange = function() { changeRoute_(element.value); }; });
      all_('[data-mode]', function(element) { element.onchange = function() { state.mode = element.value; persist_(); render(); }; });
      all_('[data-team-select]', function(element) { element.onchange = function() { state.activeTeam = Number(element.value); state.selected = { role: 0, kind: 'hero', slot: 0 }; render(); }; });
      all_('[data-team-name]', function(element) { element.onchange = function() { activeTeam_().name = element.value; persist_(); render(); }; });
      all_('[data-select-team]', function(element) { element.onclick = function() { state.activeTeam = Number(element.dataset.selectTeam); render(); }; });
      all_('[data-modal]', function(element) { element.onclick = function() { state.modal = element.dataset.modal; render(); }; });
      all_('[data-close-modal]', function(element) { element.onclick = function() { state.modal = ''; render(); }; });
      all_('[data-action]', function(element) { element.onclick = function() { action_(element.dataset.action); }; });
      all_('[data-focus-hero]', function(element) { element.onclick = function() { state.selected = { role: Number(element.dataset.focusHero), kind: 'hero', slot: 0 }; state.tab = 'heroes'; render(); }; });
      all_('[data-focus-tactic]', function(element) { element.onclick = function() { const values = element.dataset.focusTactic.split(':').map(Number); state.selected = { role: values[0], kind: 'tactic', slot: values[1] }; state.tab = 'tactics'; render(); }; });
      all_('[data-star]', function(element) { element.onclick = function() { const values = element.dataset.star.split(':').map(Number); activeTeam_().members[values[0]].breakthrough = values[1]; persist_(); render(); }; });
      all_('[data-tab]', function(element) { element.onclick = function() { state.tab = element.dataset.tab; state.query = ''; state.cost = ''; state.faction = ''; state.rarity = ''; render(); }; });
      all_('[data-query]', function(element) { element.oninput = function() { state.query = element.value; render(); }; });
      all_('[data-cost]', function(element) { element.onchange = function() { state.cost = element.value; render(); }; });
      all_('[data-faction]', function(element) { element.onchange = function() { state.faction = element.value; render(); }; });
      all_('[data-type]', function(element) { element.onchange = function() { state.faction = element.value; render(); }; });
      all_('[data-rarity]', function(element) { element.onchange = function() { state.rarity = element.value; render(); }; });
      all_('[data-owned-filter]', function(element) { element.onchange = function() { state.ownedOnly = element.checked; render(); }; });
      all_('[data-hero]', function(element) { element.onclick = function() { chooseHero_(element.dataset.hero); }; });
      all_('[data-tactic]', function(element) { element.onclick = function() { chooseTactic_(element.dataset.tactic); }; });
      all_('[data-inventory]', function(element) { element.onchange = function() { const values = element.dataset.inventory.split(':'); const ids = state.inventory[values[0]]; state.inventory[values[0]] = element.checked ? Array.from(new Set(ids.concat(values[1]))) : ids.filter(function(id) { return id !== values[1]; }); }; });
      all_('[data-profile-apply]', function(element) { element.onclick = function() { applyProfile_(element.dataset.profileApply); }; });
      all_('[data-profile-delete]', function(element) { element.onclick = function() { deleteRecord_('profiles', element.dataset.profileDelete); }; });
      all_('[data-group-load]', function(element) { element.onclick = function() { loadGroup_(element.dataset.groupLoad); }; });
      all_('[data-group-overwrite]', function(element) { element.onclick = function() { overwriteGroup_(element.dataset.groupOverwrite); }; });
      all_('[data-group-delete]', function(element) { element.onclick = function() { deleteRecord_('groups', element.dataset.groupDelete); }; });
      all_('[data-share-copy]', function(element) { element.onclick = function() { copySavedShare_(element.dataset.shareCopy); }; });
      all_('[data-share-load]', function(element) { element.onclick = function() { loadSavedShare_(element.dataset.shareLoad); }; });
      all_('[data-share-delete]', function(element) { element.onclick = function() { deleteRecord_('savedShares', element.dataset.shareDelete); }; });
      all_('[data-proposal-load]', function(element) { element.onclick = function() { loadProposal_(element.dataset.proposalLoad); }; });
      all_('[data-proposal-vote]', function(element) { element.onclick = function() { voteProposal_(element.dataset.proposalVote); }; });
      all_('[data-proposal-delete]', function(element) { element.onclick = function() { deleteRecord_('proposals', element.dataset.proposalDelete); }; });
      all_('[data-gacha-delete]', function(element) { element.onclick = function() { deleteRecord_('gachaLogs', element.dataset.gachaDelete); }; });
      all_('[data-drag-hero]', function(element) { element.ondragstart = function(event) { event.dataTransfer.setData('text/plain', 'hero:' + element.dataset.dragHero); }; });
      all_('[data-drag-member]', function(element) { element.ondragstart = function(event) { event.dataTransfer.setData('text/plain', 'member:' + element.dataset.dragMember); }; });
      all_('[data-drag-tactic]', function(element) { element.ondragstart = function(event) { event.dataTransfer.setData('text/plain', 'tactic:' + element.dataset.dragTactic); }; });
      all_('[data-drop-role]', function(element) { element.ondragover = function(event) { event.preventDefault(); }; element.ondrop = function(event) { event.preventDefault(); dropHero_(event.dataTransfer.getData('text/plain'), Number(element.dataset.dropRole)); }; });
      all_('[data-drop-tactic]', function(element) { element.ondragover = function(event) { event.preventDefault(); }; element.ondrop = function(event) { event.preventDefault(); dropTactic_(event.dataTransfer.getData('text/plain'), element.dataset.dropTactic); }; });
    }

    /**
     * 複数の要素に処理を設定する。
     * @param {string} selector CSSセレクタ。
     * @param {Function} callback 設定処理。
     * @returns {void}
     */
    function all_(selector, callback) { document.querySelectorAll(selector).forEach(callback); }

    /**
     * 操作ボタンを処理する。
     * @param {string} name 操作名。
     * @returns {void}
     */
    function action_(name) {
      if (name === 'add') {
        if (state.teams.length >= CONFIG.MAX_TEAMS) return showToast_('部隊は最大10部隊までです。');
        state.teams.push(makeTeam_(state.teams.length + 1));
        state.activeTeam = state.teams.length - 1;
      }
      if (name === 'delete') {
        if (state.teams.length <= 1) return showToast_('最後の部隊は削除できません。');
        state.teams.splice(state.activeTeam, 1);
        state.activeTeam = Math.max(0, state.activeTeam - 1);
      }
      if (name === 'reset') {
        if (!window.confirm('表示中の部隊を空にしますか？')) return;
        activeTeam_().members = Array.from({ length: 3 }, makeMember_);
      }
      if (name === 'save') {
        persist_();
        state.modal = '';
        showToast_('この端末に保存しました。');
      }
      if (name === 'share') share_();
      if (name === 'import-link') importShareLink_();
      if (name === 'profile-create') createProfile_();
      if (name === 'group-create') createGroup_();
      if (name === 'share-save') createSavedShare_();
      if (name === 'proposal-create') createProposal_();
      if (name === 'gacha-add') addGachaLog_();
      if (name === 'clear-data') clearData_();
      persist_();
      render();
    }

    /**
     * ハッシュから現在の画面を復元する。
     * @returns {void}
     */
    function restoreRoute_() {
      const value = location.hash.replace(/^#\/?/, '');
      if (value.indexOf('share=') === 0) {
        try {
          const shared = JSON.parse(decodeURIComponent(escape(atob(value.slice(6)))));
          if (shared.team) state.teams = [normalizeTeam_(shared.team)];
          if (shared.inventory) state.inventory = normalizeInventory_(shared.inventory);
          state.activeTeam = 0;
          state.route = 'lineups';
          return;
        } catch (error) {
          showToast_('共有URLの内容を読み込めませんでした。');
        }
      }
      const allowed = ['lineups', 'profiles', 'groups', 'shares', 'proposals', 'gacha', 'settings'];
      if (allowed.includes(value)) state.route = value;
    }

    /**
     * 表示ページを切り替える。
     * @param {string} route ページ識別子。
     * @returns {void}
     */
    function changeRoute_(route) {
      state.route = route;
      location.hash = '#/' + route;
      persist_();
      render();
    }

    /**
     * 端末内データを保存する。
     * @returns {void}
     */
    function persist_() {
      const data = { version: CONFIG.STORAGE_VERSION, teams: state.teams, activeTeam: state.activeTeam, inventory: state.inventory, profiles: state.profiles, groups: state.groups, savedShares: state.savedShares, proposals: state.proposals, gachaLogs: state.gachaLogs, mode: state.mode };
      localStorage.setItem(CONFIG.STORAGE_KEY, JSON.stringify(data));
    }

    /**
     * 現在の所持品をプロフィールとして保存する。
     * @returns {void}
     */
    function createProfile_() {
      const name = window.prompt('プロフィール名を入力してください。', '所持品 ' + (state.profiles.length + 1));
      if (!name) return;
      state.profiles.push({ id: makeId_(), name: name.slice(0, 40), inventory: JSON.parse(JSON.stringify(state.inventory)) });
      showToast_('プロフィールを保存しました。');
    }

    /**
     * プロフィールの所持品を適用する。
     * @param {string} id プロフィールID。
     * @returns {void}
     */
    function applyProfile_(id) {
      const profile = findRecord_('profiles', id);
      if (!profile) return;
      state.inventory = normalizeInventory_(profile.inventory);
      showToast_('プロフィールの所持品を適用しました。');
      render();
    }

    /**
     * 現在の部隊群をグループとして保存する。
     * @returns {void}
     */
    function createGroup_() {
      const name = window.prompt('部隊グループ名を入力してください。', '部隊グループ ' + (state.groups.length + 1));
      if (!name) return;
      state.groups.push({ id: makeId_(), name: name.slice(0, 40), teams: JSON.parse(JSON.stringify(state.teams)) });
      showToast_('部隊グループを保存しました。');
    }

    /**
     * グループの部隊を読み込む。
     * @param {string} id グループID。
     * @returns {void}
     */
    function loadGroup_(id) {
      const group = findRecord_('groups', id);
      if (!group || !window.confirm('現在の部隊をこのグループで置き換えますか？')) return;
      state.teams = group.teams.map(normalizeTeam_).slice(0, CONFIG.MAX_TEAMS);
      state.activeTeam = 0;
      changeRoute_('lineups');
      showToast_('部隊グループを読み込みました。');
    }

    /**
     * グループを現在の部隊群で更新する。
     * @param {string} id グループID。
     * @returns {void}
     */
    function overwriteGroup_(id) {
      const group = findRecord_('groups', id);
      if (!group || !window.confirm('このグループを現在の部隊で更新しますか？')) return;
      group.teams = JSON.parse(JSON.stringify(state.teams));
      persist_();
      render();
      showToast_('部隊グループを更新しました。');
    }

    /**
     * 現在の部隊を共有一覧へ保存する。
     * @returns {void}
     */
    function createSavedShare_() {
      const name = window.prompt('共有編成の名前を入力してください。', activeTeam_().name);
      if (!name) return;
      state.savedShares.push({ id: makeId_(), name: name.slice(0, 40), team: JSON.parse(JSON.stringify(activeTeam_())), inventory: JSON.parse(JSON.stringify(state.inventory)), createdAt: dateLabel_() });
      showToast_('共有一覧に保存しました。');
    }

    /**
     * 保存済み共有URLをコピーする。
     * @param {string} id 共有ID。
     * @returns {void}
     */
    function copySavedShare_(id) {
      const item = findRecord_('savedShares', id);
      if (!item) return;
      copyShareUrl_(item.team, item.inventory);
    }

    /**
     * 保存済み共有部隊を開く。
     * @param {string} id 共有ID。
     * @returns {void}
     */
    function loadSavedShare_(id) {
      const item = findRecord_('savedShares', id);
      if (!item) return;
      state.teams[state.activeTeam] = normalizeTeam_(item.team);
      state.inventory = normalizeInventory_(item.inventory);
      changeRoute_('lineups');
      showToast_('共有編成を開きました。');
    }

    /**
     * 現在の部隊を提案として保存する。
     * @returns {void}
     */
    function createProposal_() {
      const title = window.prompt('提案の題名を入力してください。', activeTeam_().name);
      if (!title) return;
      const description = window.prompt('提案の説明を入力してください。', '') || '';
      state.proposals.push({ id: makeId_(), title: title.slice(0, 60), description: description.slice(0, 300), team: JSON.parse(JSON.stringify(activeTeam_())), votes: 0 });
      showToast_('編成提案を保存しました。');
    }

    /**
     * 提案の部隊を開く。
     * @param {string} id 提案ID。
     * @returns {void}
     */
    function loadProposal_(id) {
      const proposal = findRecord_('proposals', id);
      if (!proposal) return;
      state.teams[state.activeTeam] = normalizeTeam_(proposal.team);
      changeRoute_('lineups');
    }

    /**
     * 提案の評価数を増やす。
     * @param {string} id 提案ID。
     * @returns {void}
     */
    function voteProposal_(id) {
      const proposal = findRecord_('proposals', id);
      if (!proposal) return;
      proposal.votes = Number(proposal.votes || 0) + 1;
      persist_();
      render();
    }

    /**
     * 抽選記録を追加する。
     * @returns {void}
     */
    function addGachaLog_() {
      const pool = window.prompt('抽選池の名前を入力してください。', '通常募集');
      if (!pool) return;
      const count = Number(window.prompt('今回の抽選回数を入力してください。', '10'));
      const rare = Number(window.prompt('今回の高レア獲得数を入力してください。', '0'));
      if (!Number.isFinite(count) || !Number.isFinite(rare) || count < 1 || rare < 0) return showToast_('抽選回数と高レア数を正しく入力してください。');
      state.gachaLogs.unshift({ id: makeId_(), pool: pool.slice(0, 40), count: Math.floor(count), rare: Math.floor(rare), createdAt: dateLabel_() });
      showToast_('抽選記録を追加しました。');
    }

    /**
     * 端末内のすべての保存データを削除する。
     * @returns {void}
     */
    function clearData_() {
      if (!window.confirm('この端末のすべての保存データを削除します。元に戻せません。')) return;
      localStorage.removeItem(CONFIG.STORAGE_KEY);
      state = makeState_();
      state.teams = [makeTeam_(1)];
      showToast_('端末データを削除しました。');
    }

    /**
     * 配列からID一致の記録を取得する。
     * @param {string} collection 状態のコレクション名。
     * @param {string} id 記録ID。
     * @returns {Object|null} 記録。
     */
    function findRecord_(collection, id) { return (state[collection] || []).find(function(item) { return item.id === id; }) || null; }

    /**
     * 保存記録を削除する。
     * @param {string} collection 状態のコレクション名。
     * @param {string} id 記録ID。
     * @returns {void}
     */
    function deleteRecord_(collection, id) {
      if (!window.confirm('この記録を削除しますか？')) return;
      state[collection] = (state[collection] || []).filter(function(item) { return item.id !== id; });
      persist_();
      render();
    }

    /**
     * 端末内記録用のIDを作成する。
     * @returns {string} ID。
     */
    function makeId_() { return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8); }

    /**
     * 現在日時を表示用の文字列にする。
     * @returns {string} 日時文字列。
     */
    function dateLabel_() { return new Date().toLocaleString('ja-JP'); }

    /**
     * 選択中の枠に武将を設定する。
     * @param {string} id 武将ID。
     * @returns {void}
     */
    function chooseHero_(id) {
      if (state.mode === 'inventory' && !state.inventory.heroIds.includes(id)) return showToast_('所持品編成では、所持武将だけを設定できます。');
      const duplicate = activeTeam_().members.some(function(member, index) { return member.heroId === id && index !== state.selected.role; });
      if (duplicate) return showToast_('同じ武将は1部隊に重複して設定できません。');
      const member = activeTeam_().members[state.selected.role];
      member.heroId = id;
      member.tacticIds = ['', ''];
      persist_();
      render();
    }

    /**
     * 選択中の枠に戦法を設定する。
     * @param {string} id 戦法ID。
     * @returns {void}
     */
    function chooseTactic_(id) {
      if (state.selected.kind !== 'tactic') return showToast_('先に武将枠内の「戦法を習得」を選択してください。');
      if (state.mode === 'inventory' && !state.inventory.tacticIds.includes(id)) return showToast_('所持品編成では、所持戦法だけを設定できます。');
      activeTeam_().members[state.selected.role].tacticIds[state.selected.slot] = id;
      persist_();
      render();
    }

    /**
     * ドラッグされた武将を役割枠へ設定する。
     * @param {string} payload ドラッグデータ。
     * @param {number} role 役割番号。
     * @returns {void}
     */
    function dropHero_(payload, role) {
      if (payload.indexOf('member:') === 0) {
        swapMembers_(Number(payload.slice(7)), role);
        return;
      }
      if (payload.indexOf('hero:') !== 0) return;
      state.selected = { role: role, kind: 'hero', slot: 0 };
      chooseHero_(payload.slice(5));
    }

    /**
     * ドラッグされた戦法を戦法枠へ設定する。
     * @param {string} payload ドラッグデータ。
     * @param {string} target 役割番号と戦法枠番号。
     * @returns {void}
     */
    function dropTactic_(payload, target) {
      if (payload.indexOf('tactic:') !== 0) return;
      const values = target.split(':').map(Number);
      state.selected = { role: values[0], kind: 'tactic', slot: values[1] };
      chooseTactic_(payload.slice(7));
    }

    /**
     * 同じ部隊内の武将枠を入れ替える。
     * @param {number} from 移動元の役割番号。
     * @param {number} to 移動先の役割番号。
     * @returns {void}
     */
    function swapMembers_(from, to) {
      if (from === to || !activeTeam_().members[from]) return;
      const members = activeTeam_().members;
      const temporary = members[from];
      members[from] = members[to];
      members[to] = temporary;
      state.selected = { role: to, kind: 'hero', slot: 0 };
      persist_();
      render();
    }

    /**
     * 共有URLを作成する。
     * @returns {void}
     */
    function share_() {
      copyShareUrl_(activeTeam_(), state.inventory);
    }

    /**
     * 入力された共有URLから部隊を読み込む。
     * @returns {void}
     */
    function importShareLink_() {
      const url = window.prompt('共有URLを貼り付けてください。', '');
      if (!url) return;
      const marker = '#share=';
      const index = url.indexOf(marker);
      if (index < 0) return showToast_('真戦編成の共有URLを入力してください。');
      const shared = decodeSharedData_(url.slice(index + marker.length));
      if (!shared || !shared.team) return showToast_('共有URLの内容を読み込めませんでした。');
      state.teams[state.activeTeam] = normalizeTeam_(shared.team);
      if (shared.inventory) state.inventory = normalizeInventory_(shared.inventory);
      persist_();
      render();
      showToast_('共有編成を読み込みました。');
    }

    /**
     * Base64化された共有データを復元する。
     * @param {string} value 共有データ文字列。
     * @returns {Object|null} 復元結果。
     */
    function decodeSharedData_(value) {
      try { return JSON.parse(decodeURIComponent(escape(atob(value)))); } catch (error) { return null; }
    }

    /**
     * 部隊情報を埋め込んだ共有URLをコピーする。
     * @param {Object} team 共有する部隊。
     * @param {Object} inventory 共有する所持品。
     * @returns {void}
     */
    function copyShareUrl_(team, inventory) {
      const data = { team: team, inventory: inventory };
      const url = location.origin + location.pathname + '#share=' + btoa(unescape(encodeURIComponent(JSON.stringify(data))));
      if (navigator.clipboard) navigator.clipboard.writeText(url);
      showToast_('共有URLをクリップボードにコピーしました。');
    }

    /**
     * 一時メッセージを表示する。
     * @param {string} text 表示文。
     * @returns {void}
     */
    function showToast_(text) {
      state.toast = text;
      render();
      window.setTimeout(function() { if (state.toast === text) { state.toast = ''; render(); } }, 2600);
    }

    /**
     * 表示中の部隊を取得する。
     * @returns {Object} 部隊。
     */
    function activeTeam_() { return state.teams[state.activeTeam]; }

    /**
     * 武将をIDから取得する。
     * @param {string} id 武将ID。
     * @returns {Object|null} 武将。
     */
    function hero_(id) { return (master.heroes || []).find(function(hero) { return hero.id === id; }) || null; }

    /**
     * 戦法をIDから取得する。
     * @param {string} id 戦法ID。
     * @returns {Object|null} 戦法。
     */
    function tactic_(id) { return (master.tactics || []).find(function(tactic) { return tactic.id === id; }) || null; }

    /**
     * 部隊の合計コストを取得する。
     * @param {Object} team 部隊。
     * @returns {number} 合計コスト。
     */
    function teamCost_(team) { return team.members.reduce(function(total, member) { const hero = hero_(member.heroId); return total + Number(hero ? hero.cost : 0); }, 0); }

    /**
     * 特性から兵種の概算を集計する。
     * @param {Object} team 部隊。
     * @returns {Object} 兵種別件数。
     */
    function troopSummary_(team) {
      const result = { foot: 0, bow: 0, cavalry: 0, gun: 0 };
      team.members.forEach(function(member) { const hero = hero_(member.heroId); (hero && hero.traits || []).forEach(function(trait) { (trait.affinity && trait.affinity.troopTypes || []).forEach(function(type) { if (type === '歩兵') result.foot += 1; if (type === '弓兵') result.bow += 1; if (type === '騎兵') result.cavalry += 1; if (type === '鉄砲') result.gun += 1; }); }); });
      return result;
    }

    /**
     * 条件に合う武将を取得する。
     * @returns {Array<Object>} 武将一覧。
     */
    function filteredHeroes_() {
      const query = state.query.toLowerCase();
      return (master.heroes || []).filter(function(hero) { return (!query || (hero.name + hero.uniqueSkill + hero.clan).toLowerCase().includes(query)) && (!state.cost || (state.cost === '4' ? Number(hero.cost) <= 4 : String(hero.cost) === state.cost)) && (!state.faction || hero.faction === state.faction) && (!state.rarity || hero.rarity === state.rarity) && (!(state.ownedOnly || state.mode === 'inventory') || state.inventory.heroIds.includes(hero.id)); });
    }

    /**
     * 条件に合う戦法を取得する。
     * @returns {Array<Object>} 戦法一覧。
     */
    function filteredTactics_() {
      const query = state.query.toLowerCase();
      return (master.tactics || []).filter(function(tactic) { return tactic.learnable && (!query || (tactic.name + tactic.type + tactic.target).toLowerCase().includes(query)) && (!state.faction || tactic.type === state.faction) && (!state.rarity || tactic.rarity === state.rarity) && (!(state.ownedOnly || state.mode === 'inventory') || state.inventory.tacticIds.includes(tactic.id)); });
    }

    /**
     * 配列内のキー値を重複なく返す。
     * @param {Array<Object>} values データ。
     * @param {string} key キー名。
     * @returns {Array<string>} 値一覧。
     */
    function unique_(values, key) { return Array.from(new Set(values.map(function(value) { return value[key]; }).filter(Boolean))).sort(); }

    /**
     * HTML表示用に文字列をエスケープする。
     * @param {*} value 表示値。
     * @returns {string} エスケープ済み文字列。
     */
    function escape_(value) { return String(value || '').replace(/[&<>"']/g, function(character) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[character]; }); }

    init();
  </script>
</body>
</html>
